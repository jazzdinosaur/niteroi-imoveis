<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Obrigado - Viva em Niteroi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:   #0e1a20;
      --ocean: #1b4f63;
      --gold:  #c8893a;
      --sand:  #f5ede0;
      --white: #ffffff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Jost', sans-serif; background: var(--ocean); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
    .icon { font-size: 3.5rem; margin-bottom: 1.5rem; }
    h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 700; line-height: 1.15; margin-bottom: 1.2rem; }
    h1 em { font-style: italic; font-weight: 400; color: #f0d8b8; }
    p { font-size: 1rem; font-weight: 300; color: rgba(255,255,255,0.75); line-height: 1.75; max-width: 480px; margin-bottom: 2.5rem; }
    .btn { display: inline-block; background: var(--gold); color: var(--white); font-family: 'Jost', sans-serif; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; padding: 1rem 2.5rem; transition: background 0.2s; }
    .btn:hover { background: #b37730; }
    .footer-note { margin-top: 3rem; font-size: 0.7rem; color: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div class="icon">&#10003;</div>
  <h1>Cadastro recebido,<br><em>obrigado!</em></h1>
  <p>Recebemos suas informacoes e entraremos em contato em breve com detalhes sobre imoveis disponiveis em Niteroi.</p>
  <a href="https://jazzdinosaur.github.io/niteroi-imoveis/" class="btn">Voltar ao site</a>
  <p class="footer-note">Viva em Niteroi &mdash; Niteroi, RJ, Brasil</p>
</body>
</html>
